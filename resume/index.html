<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Resume</title>
    <style>
        /* 移除浏览器默认的边距，让 PDF 占满整个屏幕 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* 防止出现双重滚动条 */
        }
        
        /* 设置 iframe 的大小 */
        .resume-iframe {
            width: 100%;
            height: 100vh; /* 100vh 代表占满整个屏幕高度 */
            border: none;  /* 移除边框 */
        }
        
        /* 移动端提示样式 */
        .mobile-fallback {
            display: none;
            text-align: center;
            padding: 20px;
            font-family: sans-serif;
        }

        /* 针对手机屏幕较小的设备，有些手机浏览器不支持内嵌预览 PDF */
        @media (max-width: 768px) {
            .mobile-fallback {
                display: block;
            }
        }
    </style>
</head>
<body>
    
    <!-- 移动端备用下载链接（因为部分手机浏览器强制下载PDF而不是预览） -->
    <div class="mobile-fallback">
        <p>您的浏览器可能不支持直接预览 PDF。</p>
        <a href="myResume.pdf" target="_blank" rel="noopener noreferrer">点击这里下载或查看我的简历</a>
    </div>

    <!-- 这里的 src 替换成你真实的 pdf 文件路径，例如 "./resume.pdf" -->
    <iframe class="resume-iframe" src="myResume.pdf" title="My Resume">
        <!-- 如果浏览器完全不支持 iframe，会显示这段文字 -->
        <p>您的浏览器不支持内嵌预览，请 <a href="myResume.pdf">点击下载简历</a>。</p>
    </iframe>

</body>
</html>
